# Daily full sync from Predidit/media-kit.
# All upstream branches/tags are force-copied. main is merged so this workflow stays.
name: Sync Upstream

on:
  schedule:
    # Every day at 00:00 (Asia/Shanghai) = 16:00 UTC
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/Predidit/media-kit.git 2>/dev/null \
            || git remote set-url upstream https://github.com/Predidit/media-kit.git
          git fetch upstream --tags --force --prune
          git fetch origin --prune

      - name: Sync all non-main branches (always force copy)
        run: |
          set -euo pipefail
          while IFS= read -r ref; do
            name="${ref#refs/remotes/upstream/}"
            if [ "$name" = "HEAD" ] || [ "$name" = "main" ]; then
              continue
            fi
            upstream_sha="$(git rev-parse "$ref")"
            echo "Copying branch: $name -> $upstream_sha"
            git push origin "$ref:refs/heads/$name" --force
          done < <(git for-each-ref --format='%(refname)' refs/remotes/upstream/)

      - name: Sync main (merge all upstream changes)
        run: |
          set -euo pipefail
          git checkout -B main origin/main
          before="$(git rev-parse HEAD)"
          # Always merge upstream/main so any new commits/files are copied over.
          # -X ours keeps sync workflow + Years-kit README if paths conflict.
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "main already contains upstream/main; ensuring merge-base is current"
          fi
          git merge upstream/main --no-edit -X ours \
            || {
              echo "Merge conflict; keeping Years-kit docs/workflow, taking upstream elsewhere"
              git checkout --ours .github/workflows/sync-upstream.yml README.md 2>/dev/null || true
              mkdir -p .github/workflows
              if [ ! -f .github/workflows/sync-upstream.yml ]; then
                git show origin/main:.github/workflows/sync-upstream.yml > .github/workflows/sync-upstream.yml
              fi
              if [ ! -f README.md ]; then
                git show origin/main:README.md > README.md
              fi
              git add -A
              git commit --allow-empty -m "chore: daily sync from upstream/main"
            }
          after="$(git rev-parse HEAD)"
          if [ "$before" != "$after" ]; then
            git push origin main
            echo "main updated: $before -> $after"
          else
            # Still push a no-op marker only when needed; otherwise report up to date
            echo "main already mirrored upstream content (plus sync workflow)"
          fi

      - name: Sync all tags (always force copy)
        run: |
          set -euo pipefail
          git push origin "refs/tags/*:refs/tags/*" --force
          echo "All tags copied from upstream."
