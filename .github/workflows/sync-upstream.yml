# Keeps this repository in sync with Predidit/media-kit.
# main is merged (not force-reset) so this workflow file stays on the default branch.
name: Sync Upstream

on:
  schedule:
    # Every 6 hours (UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/Predidit/media-kit.git 2>/dev/null \
            || git remote set-url upstream https://github.com/Predidit/media-kit.git
          git fetch upstream --tags --force --prune
          git fetch origin --prune

      - name: Sync non-main branches
        run: |
          set -euo pipefail
          while IFS= read -r ref; do
            name="${ref#refs/remotes/upstream/}"
            if [ "$name" = "HEAD" ] || [ "$name" = "main" ]; then
              continue
            fi
            local_sha="$(git rev-parse "refs/heads/$name" 2>/dev/null || true)"
            upstream_sha="$(git rev-parse "$ref")"
            if [ "$local_sha" != "$upstream_sha" ]; then
              echo "Updating branch: $name ($local_sha -> $upstream_sha)"
              git push origin "$ref:refs/heads/$name" --force
            else
              echo "Branch up to date: $name"
            fi
          done < <(git for-each-ref --format='%(refname)' refs/remotes/upstream/)

      - name: Sync main via merge
        run: |
          set -euo pipefail
          git checkout -B main origin/main
          before="$(git rev-parse HEAD)"
          # Prefer ours for the sync workflow if upstream ever adds the same path
          git merge upstream/main --no-edit -X ours \
            || {
              echo "Merge conflict; keeping our sync workflow and taking upstream elsewhere"
              git checkout --ours .github/workflows/sync-upstream.yml 2>/dev/null || true
              mkdir -p .github/workflows
              # Ensure workflow exists even if upstream deleted .github
              if [ ! -f .github/workflows/sync-upstream.yml ]; then
                git show origin/main:.github/workflows/sync-upstream.yml > .github/workflows/sync-upstream.yml
              fi
              git add -A
              git commit -m "chore: sync upstream/main (resolve conflicts)"
            }
          after="$(git rev-parse HEAD)"
          if [ "$before" != "$after" ]; then
            git push origin main
            echo "main updated: $before -> $after"
          else
            echo "main already up to date with upstream"
          fi

      - name: Sync tags
        run: |
          set -euo pipefail
          git push origin --tags --force
          echo "Tags synced."
